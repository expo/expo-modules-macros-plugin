name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apple

jobs:
  build-and-test:
    name: Build & test
    # The package declares swift-tools-version 6.2, which requires Xcode 26+.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Select Xcode
        # Pin to an Xcode that ships Swift 6.2 (required by Package.swift).
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apple/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apple/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release tool
        # Runs `npm run build` (apple/build.js): builds the release plugin
        # binary, copies it to apple/ExpoModulesMacros-tool, and strips it.
        working-directory: ${{ github.workspace }}
        run: npm run build

      - name: Verify committed binary is up to date
        # The stripped binary is committed and is what consumers run. If the
        # source changed without rebuilding it, the working tree will be dirty.
        # Use continue-on-error so the test suite still runs; the job is failed
        # by the final gate step below.
        id: verify
        continue-on-error: true
        run: |
          if ! git diff --quiet -- ExpoModulesMacros-tool; then
            echo "::error::apple/ExpoModulesMacros-tool is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- ExpoModulesMacros-tool
            exit 1
          fi
          echo "Committed binary is up to date."

      - name: Test
        run: swift test -v

      - name: Fail if committed binary is out of date
        # Fail the job if the binary was stale, even though tests were allowed
        # to run above so both signals appear in a single CI run.
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Binary verification failed — see the 'Verify committed binary is up to date' step."
          exit 1
